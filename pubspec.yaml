name: daily_tarot_focus
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+6

environment:
  sdk: ^3.7.2

dependencies:
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_inset_shadow: ^2.0.3
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.0
  go_router: ^17.0.0
  gradient_borders: ^1.0.2
  http: ^1.2.2
  image: ^4.5.4
  lottie: ^3.1.0
  mobile_boilerplate:
    path: ../mobile-boilerplate
  path_provider: ^2.1.5
  shimmer_animation: ^2.2.2
  supabase: ^2.10.0
  very_good_analysis: ^10.0.0
  
dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
  assets:
    - .env.keys
    - assets/translations/
    - assets/data/
    - assets/png/
    - assets/svg/
    - assets/json/
    - assets/jpg/

