name: daily_tarot_focus
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  mobile_core:
    path: ../mobile-core
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  image: ^4.5.4
  image_gallery_saver: ^2.0.3
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_inset_shadow: ^2.0.3
  gradient_borders: ^1.0.2
  auto_size_text: ^3.0.0
  flutter_spinkit: ^5.2.2
  shimmer_animation: ^2.2.2
  home_widget: ^0.8.1
  liquid_glass_renderer: ^0.2.0-dev.2
  flutter_switch: ^0.3.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist-Black.ttf
          weight: 900
  assets:
    - .env.keys
    - assets/translations/
    - assets/png/
    - assets/svg/
    - assets/gif/
    - assets/srt/
